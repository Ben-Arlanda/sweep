name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  api:
    runs-on: ubuntu-latest
    # A real Postgres (same image as docker-compose) for integration tests.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sweep
          POSTGRES_PASSWORD: sweep
          POSTGRES_DB: sweep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweep"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sweep:sweep@localhost:5432/sweep_test
      TEST_DATABASE_URL: postgresql://sweep:sweep@localhost:5432/sweep_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Fails if a model changed without a matching migration.
      # (pytest has just migrated the database to head.)
      - run: uv run alembic check
