[[recipe]]
slug = "hawaiian-pizza"
title = "Homemade ham and pineapple pizza"
cuisine = "australian"
servings = 4
minutes = 90
summary = "A simple homemade dough topped with tomato, ham, pineapple and mozzarella."
ingredients = [
  "400 g plain flour",
  "1 tsp dried yeast",
  "1 tsp salt",
  "250 ml warm water",
  "2 tbsp olive oil",
  "125 g tomato paste",
  "1 tsp dried oregano",
  "200 g ham, chopped",
  "225 g canned pineapple, drained",
  "250 g mozzarella, grated",
]
method = [
  "Mix the flour, yeast, salt, water and oil and knead for 8 minutes until smooth. Cover and rest for 1 hour until doubled.",
  "Heat the oven to 240°C. Halve the dough and stretch into 2 bases on oiled trays.",
  "Spread with tomato paste, sprinkle with oregano and top with the ham, pineapple and mozzarella.",
  "Bake for 12 minutes until the base is crisp and the cheese is bubbling.",
