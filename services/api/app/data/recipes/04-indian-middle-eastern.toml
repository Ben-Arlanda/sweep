[[recipe]]
slug = "butter-chicken"
title = "Butter chicken"
cuisine = "indian"
course = "main"
servings = 4
minutes = 50
summary = "Tender chicken in a mild, creamy tomato and butter sauce with garam masala."
ingredients = [
  "750 g chicken thigh, diced",
  "150 g greek yoghurt",
  "2 tsp garam masala",
  "40 g butter",
  "1 onion, diced",
  "3 cloves garlic, crushed",
  "1 tbsp ginger, grated",
  "1 tsp ground turmeric",
  "400 g can diced tomatoes",
  "125 ml thickened cream",
  "1 cup basmati rice",
]
method = [
  "Marinate the chicken in the yoghurt and half the garam masala for 15 minutes or overnight.",
  "Cook the onion, garlic and ginger in the butter in a large pan over medium heat for 5 minutes until soft. Add the turmeric and remaining garam masala, then the tomatoes. Simmer 10 minutes and blend.",
  "Add the chicken and simmer for 15 minutes until cooked through. Meanwhile, cook the rice according to the packet. Stir the cream into the curry and serve with the rice.",
]

