[[recipe]]
slug = "moussaka"
title = "Moussaka"
cuisine = "greek"
course = "main"
servings = 8
minutes = 120
summary = "Layers of eggplant and cinnamon-spiced lamb under a thick, golden white sauce."
ingredients = [
  "3 eggplants, sliced",
  "80 ml olive oil",
  "1 onion, diced",
  "2 cloves garlic, crushed",
  "750 g lamb mince",
  "1 tsp ground cinnamon",
  "400 g can diced tomatoes",
  "60 g butter",
  "60 g plain flour",
  "750 ml milk",
  "2 eggs",
  "50 g parmesan, grated",
]
method = [
  "Heat the oven to 200°C. Brush the eggplant with oil and bake for 20 minutes until soft.",
  "Brown the onion, garlic and lamb in a large pan over medium-high heat for 8 minutes, breaking up the mince, until no longer pink. Add the cinnamon and tomatoes and simmer for 20 minutes.",
  "Melt the butter in a saucepan over medium heat, stir in the flour for 1 minute, then whisk in the milk and cook for 5 minutes until thick. Off the heat, beat in the eggs and parmesan.",
  "Turn the oven down to 180°C. Layer eggplant and lamb in a dish, top with the sauce, and bake for 45 minutes until golden on top and the sauce is set.",
]

[[recipe]]
slug = "spanakopita"
title = "Spanakopita"
cuisine = "greek"
course = "main"
servings = 8
minutes = 75
summary = "Crisp filo pie filled with spinach, feta, ricotta, dill and spring onion."
ingredients = [
  "500 g baby spinach",
  "200 g feta, crumbled",
  "250 g ricotta",
  "3 eggs",
  "4 spring onions, sliced",
  "1 bunch dill, chopped",
  "12 sheets filo pastry",
  "80 g butter, melted",
]
method = [
  "Heat the oven to 180°C. Wilt the spinach in a large covered pan over medium heat for 3–4 minutes, stirring once. Cool, squeeze out all the water, and chop. Mix with the cheeses, eggs, spring onion and dill.",
  "Layer half the filo in a dish, brushing each sheet with butter. Add the filling and top with the remaining buttered sheets.",
  "Score the top and bake for 45 minutes until golden.",
]

