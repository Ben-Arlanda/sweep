[[recipe]]
slug = "greek-lamb-souvlaki"
title = "Lamb souvlaki with tzatziki"
cuisine = "greek"
course = "main"
servings = 4
minutes = 40
summary = "Lemon and oregano lamb skewers in warm pita with tzatziki, tomato and red onion."
ingredients = [
  "600 g lamb leg, diced",
  "3 tbsp olive oil",
  "1 lemon, juiced",
  "2 tsp dried oregano",
  "200 g greek yoghurt",
  "1 cucumber, grated",
  "1 clove garlic, crushed",
  "4 pita breads",
  "2 tomatoes, sliced",
  "1 red onion, sliced",
]
method = [
  "Marinate the lamb in the oil, lemon juice and oregano for at least 20 minutes. Thread onto skewers.",
  "Squeeze the cucumber dry and mix with the yoghurt and garlic.",
  "Grill the skewers on a hot grill or barbecue for 8–10 minutes, turning, until charred outside and cooked through. Serve in pita with tzatziki, tomato and onion.",
]

