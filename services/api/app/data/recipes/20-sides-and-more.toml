[[recipe]]
slug = "pho-ga"
title = "Chicken pho (pho ga)"
cuisine = "vietnamese"
servings = 4
minutes = 75
summary = "A clear, fragrant chicken broth with star anise and ginger, poured over rice noodles and herbs."
ingredients = [
  "800 g chicken thigh",
  "2 litres chicken stock",
  "1 onion, halved",
  "30 g ginger, sliced",
  "3 star anise",
  "1 cinnamon stick",
  "3 tbsp fish sauce",
  "1 tsp white sugar",
  "300 g rice noodles",
  "150 g bean sprouts",
  "1 bunch basil, leaves picked",
  "1 bunch coriander, leaves picked",
  "2 limes, cut into wedges",
  "1 red chilli, sliced",
]
method = [
  "Char the onion and ginger in a dry pan for 5 minutes. Add to the stock with the star anise and cinnamon and simmer for 20 minutes.",
  "Add the chicken and simmer for 25 minutes until cooked through. Lift out and shred. Strain the broth and season with the fish sauce and sugar.",
  "Soak the noodles in hot water until soft and drain.",
  "Divide the noodles and chicken between bowls, pour over the hot broth and serve with bean sprouts, herbs, lime and chilli.",
]

[[recipe]]
slug = "banh-xeo"
title = "Crispy Vietnamese pancakes (banh xeo)"
cuisine = "vietnamese"
servings = 4
minutes = 40
summary = "Golden turmeric and coconut crepes filled with pork, prawns and bean sprouts, wrapped in lettuce."
ingredients = [
  "150 g plain flour",
  "2 tbsp cornflour",
  "1 tsp ground turmeric",
  "200 ml coconut milk",
  "250 ml water",
  "3 spring onions, sliced",
  "250 g pork mince",
  "250 g prawns, peeled and halved",
  "3 tbsp vegetable oil",
  "200 g bean sprouts",
  "1 lettuce, leaves separated",
  "1 bunch mint, leaves picked",
  "3 tbsp fish sauce",
  "1 lime, juiced",
  "1 tbsp white sugar",
]
method = [
  "Whisk the flour, cornflour, turmeric, coconut milk and water to a thin batter. Stir in the spring onions and rest for 10 minutes.",
  "Fry the pork and prawns in 1 tbsp oil for 5 minutes until the pork is cooked through and the prawns are pink. Remove.",
  "Heat a little oil in a frying pan, pour in a thin layer of batter, scatter with some filling and bean sprouts, cover and cook for 3 minutes until crisp. Fold over and repeat.",
  "Mix the fish sauce, lime juice and sugar for dipping. Wrap pieces in lettuce with mint and dip.",
]

