[[recipe]]
slug = "shish-tawook"
title = "Shish tawook (garlic chicken skewers)"
cuisine = "middle-eastern"
servings = 4
minutes = 40
summary = "Chicken marinated in yoghurt, lemon, garlic and paprika, grilled and served in pita."
ingredients = [
  "800 g chicken breast, cut into cubes",
  "200 g greek yoghurt",
  "1 lemon, juiced",
  "4 cloves garlic, crushed",
  "2 tsp paprika",
  "1 tsp ground cumin",
  "1/2 tsp salt",
  "1 tbsp olive oil",
  "4 pita bread",
  "2 tomatoes, sliced",
  "1 lettuce, shredded",
]
method = [
  "Mix the yoghurt, lemon juice, garlic, paprika, cumin, salt and oil, and coat the chicken. Marinate for 15 minutes.",
  "Thread onto skewers and grill for 10–12 minutes, turning, until charred and cooked through.",
  "Serve in warm pita with tomato and lettuce.",
]

[[recipe]]
slug = "mujadara"
