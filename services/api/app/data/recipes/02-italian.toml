[[recipe]]
slug = "lasagne"
title = "Beef lasagne"
cuisine = "italian"
servings = 8
minutes = 110
summary = "Layers of beef ragu, white sauce and pasta sheets, baked until golden and bubbling."
ingredients = [
  "1 tbsp olive oil",
  "1 onion, diced",
  "2 cloves garlic, crushed",
  "750 g beef mince",
  "700 g passata",
  "2 tbsp tomato paste",
  "60 g butter",
  "60 g plain flour",
  "750 ml milk",
  "250 g lasagne sheets",
  "150 g mozzarella, grated",
  "40 g parmesan, grated",
]
method = [
  "Make the ragu: soften the onion and garlic in the oil, brown the mince, then add the passata and tomato paste. Simmer for 20 minutes.",
  "Make the white sauce: melt the butter, stir in the flour, then whisk in the milk until thick.",
  "Layer ragu, pasta sheets and white sauce in a baking dish, three times. Top with the cheeses.",
  "Bake at 180°C for 45 minutes. Rest for 10 minutes before cutting.",
]

