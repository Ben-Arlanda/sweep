[[recipe]]
slug = "lasagne"
title = "Beef lasagne"
cuisine = "italian"
course = "main"
servings = 8
minutes = 110
summary = "Layers of beef ragu, white sauce and lasagne sheets, baked until golden and bubbling."
ingredients = [
  "1 tbsp olive oil",
  "1 onion, diced",
  "2 cloves garlic, crushed",
  "750 g beef mince",
  "700 g passata",
  "2 tbsp tomato paste",
  "60 g butter",
  "60 g plain flour",
  "750 ml milk",
  "375 g lasagne sheets",
  "150 g mozzarella, grated",
  "40 g parmesan, grated",
]
method = [
  "Make the ragu: soften the onion and garlic in the oil in a large pan over medium heat for 5 minutes. Add the mince and cook, breaking it up, until browned, then add the passata and tomato paste. Simmer for 20 minutes.",
  "Make the white sauce: melt the butter in a saucepan over medium heat and stir in the flour for 1 minute. Gradually whisk in the milk and stir for 5 minutes until thick.",
  "Heat the oven to 180°C. Layer ragu, lasagne sheets and white sauce in a baking dish, three times. Top with the cheeses.",
  "Bake for 45 minutes until golden and bubbling. Rest for 10 minutes before cutting.",
]

