[[recipe]]
slug = "spaghetti-bolognese"
title = "Spaghetti bolognese"
cuisine = "italian"
servings = 4
minutes = 50
summary = "The family-favourite beef mince and tomato sauce, simmered until rich, over spaghetti."
ingredients = [
  "1 tbsp olive oil",
  "1 onion, finely diced",
  "1 carrot, finely diced",
  "2 cloves garlic, crushed",
  "500 g beef mince",
  "2 tbsp tomato paste",
  "2 x 400 g cans diced tomatoes",
  "1 tsp dried oregano",
  "400 g pasta",
  "30 g parmesan, grated",
]
method = [
  "Heat the oil in a large pan over medium heat. Cook the onion and carrot for 5 minutes until soft, then add the garlic.",
  "Add the mince and cook, breaking it up, until browned. Stir in the tomato paste for a minute.",
  "Add the tomatoes and oregano, season, and simmer gently for 25–30 minutes until thick.",
  "Cook the pasta in salted boiling water. Drain and serve topped with the sauce and parmesan.",
]

[[recipe]]
