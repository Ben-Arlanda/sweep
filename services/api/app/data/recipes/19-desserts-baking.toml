[[recipe]]
slug = "lemon-tart"
title = "Lemon tart"
cuisine = "french"
servings = 8
minutes = 230
summary = "A crisp pastry case filled with a smooth, tangy lemon custard. Vegetarian."
ingredients = [
  "1 sheet shortcrust pastry",
  "4 eggs",
  "150 g caster sugar",
  "3 lemons, zested and juiced",
  "150 ml thickened cream",
  "1 tbsp icing sugar",
]
method = [
  "Heat the oven to 180°C. Line a 23 cm tart tin with the pastry, prick the base, line with baking paper and pastry weights and blind-bake for 15 minutes. Remove the paper and weights and bake for 5 minutes more.",
  "Lower the oven to 150°C. Whisk the eggs, sugar, lemon zest and juice and cream until smooth.",
  "Pour into the pastry case and bake for 30 minutes until just set with a slight wobble.",
  "Cool, then chill for at least 3 hours. Dust with icing sugar to serve.",
]

[[recipe]]
slug = "chocolate-self-saucing-pudding"
title = "Chocolate self-saucing pudding"
cuisine = "australian"
servings = 6
minutes = 50
summary = "A soft chocolate sponge that makes its own rich sauce underneath as it bakes. Vegetarian."
ingredients = [
  "150 g self-raising flour",
  "150 g caster sugar",
  "4 tbsp cocoa powder",
  "125 ml milk",
  "60 g butter, melted",
  "1 egg",
  "1 tsp vanilla extract",
  "100 g brown sugar",
  "375 ml boiling water",
]
method = [
  "Heat the oven to 180°C and grease a 1.5 litre baking dish.",
  "Mix the flour, caster sugar and 2 tbsp cocoa. Whisk in the milk, butter, egg and vanilla and spread in the dish.",
  "Mix the brown sugar and the rest of the cocoa and sprinkle over. Carefully pour the boiling water over the back of a spoon.",
  "Bake for 35 minutes until the top is firm. Rest for 5 minutes before serving.",
]

