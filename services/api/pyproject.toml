[project]
name = "sweep-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]  # generated by Alembic
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# Our migrations folder is also called alembic/; this is the installed package.
known-third-party = ["alembic"]
